# Read automatically by sonar-scanner CLI from the project's working
# directory — `make sonar-scan` relies on this rather than repeating these
# flags inline. The server is the local, persistent one of
# deploy/dev/observability.yml's `quality` profile (SonarQube is not in CI);
# SONAR_HOST_URL and SONAR_TOKEN come from the make target.
sonar.projectKey=agent-core-demo
sonar.sources=app,scripts,packages/billing/src,services/ml-service,services/authlimit
sonar.tests=tests
sonar.exclusions=**/__pycache__/**,**/*.sqlite3,**/*_test.go
sonar.python.version=3.13
