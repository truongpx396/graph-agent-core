# Prod counterpart of ../promtail-config.yaml — runs ON THE APP DROPLET
# (deploy/prod/collectors.yml's `promtail` service), not the observability
# droplet, because Promtail discovers/tails containers via the LOCAL Docker
# daemon socket (docker_sd_configs below): it has to be co-located with the
# containers it reads, unlike Prometheus/otel-collector which can scrape or
# receive over a network. Only the `clients.url` target differs from dev —
# pushing to the observability droplet's Loki over the DO VPC instead of the dev
# file's `host.docker.internal:3100` — via LOKI_PUSH_HOST, substituted by Promtail's own
# `-config.expand-env=true` flag (deploy/prod/collectors.yml's command).
server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://${LOKI_PUSH_HOST}/loki/api/v1/push

scrape_configs:
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
    relabel_configs:
      - source_labels: [__meta_docker_container_label_com_docker_compose_service]
        regex: "^(api|agent-worker|ingest-worker|ml-service|mcp-gateway|telegram-bot|caddy|authlimit|casdoor|litellm|postgres|redis|qdrant)$"
        action: keep
      - source_labels: [__meta_docker_container_name]
        regex: "/(.*)"
        target_label: container
      - source_labels: [__meta_docker_container_label_com_docker_compose_project]
        target_label: compose_project
      - source_labels: [__meta_docker_container_label_com_docker_compose_service]
        target_label: compose_service
    pipeline_stages:
      # Same structlog JSON parsing as ../promtail-config.yaml — see that
      # file's own comment. api/agent-worker/ingest-worker log JSON;
      # litellm/postgres/redis/qdrant log plain text and just skip this
      # stage harmlessly.
      # Health probes come every few seconds, all day, and are worth a line only when they fail.
      - drop:
          expression: '"GET /(health(/[a-z]+)?|healthz|readyz|metrics) HTTP/[0-9.]+" 200'
          drop_counter_reason: health_probe
      - json:
          expressions:
            level: level
            logger: logger
      # One spelling per level: Python writes `warning`, authlimit `WARN`, others `warn`. The dashboard filters on this label.
      - template:
          source: level
          template: '{{ if .Value }}{{ if eq (ToLower .Value) "warn" }}warning{{ else }}{{ ToLower .Value }}{{ end }}{{ end }}'
      - labels:
          level:
          logger:
