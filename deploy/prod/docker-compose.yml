# Lean production stack for the DigitalOcean droplet deploy/terraform provisions (runbook: deploy/README.md): a subset of the dev stack (deploy/dev/) with a hosted LLM endpoint
# (litellm-config.yaml), no Langfuse or Open WebUI, and S3-compatible object storage (DigitalOcean Spaces) instead of MinIO (MINIO_* in deploy/prod/prod.env.example).
#
# One compose project made of the parts under `include`, named as dev's are:
#   infra.yml       Postgres, PgBouncer, the queue's Redis and the answer cache's, Qdrant, LiteLLM
#   app.yml         the ML service, the API, the two workers, the MCP gateway and the opt-in Telegram bot
#   gateway.yml     the front door: Caddy, authlimit, Casdoor (as dev's; the routing is deploy/shared/caddy/gateway.caddy)
#   collectors.yml  the exporters and agents that feed the observability droplet
#
# Not here, on purpose: tools.yml (the crawler must not run as it is, since a page can steer its browser to an internal address: PRODUCTION_REVIEW.md R20, deploy/README.md "The
# crawler's network"; the sandbox server mounts the Docker socket, so those tools stay absent) and the Grafana/Prometheus/Loki stack, which runs on a separate droplet (observability.yml
# here) so a metrics spike cannot compete with the app. Unlike dev, the Telegram bot is a container here (profile `telegram`).
#
# A domain is REQUIRED: identity needs an https issuer (pattern 98; specs/018 T069).
#
# .github/workflows/deploy.yml builds the app and ml-service images to GHCR, rsyncs these files with deploy/prod/caddy/, deploy/shared/caddy/, litellm-config.yaml, postgres-init/ and
# observability/ to /opt/graph-agent-core, and runs `docker compose --project-directory . -f deploy/prod/docker-compose.yml pull && up -d`. Services use `image:`, never `build:`, so the
# droplet never compiles onnxruntime's dependency chain. The droplet's .env is made once by hand (deploy/prod/prod.env.example); CI never touches it.
#
# Every path in these files, the `include` paths too, is relative to the repo root: run compose with `--project-directory .` (deploy/dev/docker-compose.yml says why).
name: graph-agent-core

include:
  - path: ./deploy/prod/infra.yml
    project_directory: .
  - path: ./deploy/prod/app.yml
    project_directory: .
  - path: ./deploy/prod/gateway.yml
    project_directory: .
  - path: ./deploy/prod/collectors.yml
    project_directory: .
