# Override for loadtest/locustfile_queued.py runs (`make loadtest-app-up`): points the containerized app roles' OPENAI_API_BASE at
# loadtest/fake_llm_server.py (host-native on :9009; start it with `make fake-llm`) instead of litellm, without touching app.yml or
# stopping a container. Compose merges `environment` key by key across -f files, so everything else still comes from app.yml's
# `x-app-env`. Revert with `make up-app`, which recreates these services from the project's own files alone.
services:
  api:
    environment:
      OPENAI_API_BASE: http://host.docker.internal:9009/v1

  agent-worker:
    environment:
      OPENAI_API_BASE: http://host.docker.internal:9009/v1
      # Raised from the defaults (10/10, app/core/config.py) on this one replica, to test whether checkpoint-lock contention (the saver's
      # per-instance lock, app/adapters/outbound/postgres/checkpointing.py) caps in-process throughput even with both knobs open.
      AGENT_WORKER_MAX_CONCURRENCY: "50"
      CHECKPOINTER_POOL_MAX_SIZE: "50"
      # Below what locustfile_queued.py's HUGE_MESSAGE comes back as, so its token-budget scenario can end a turn at the ceiling: the default is
      # more words than the API's message limit lets one request carry.
      MAX_TOKENS_PER_TURN: "12000"

  ingest-worker:
    environment:
      OPENAI_API_BASE: http://host.docker.internal:9009/v1
