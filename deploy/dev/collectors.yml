# The database exporters (`make collectors-up`; `make obs-up` runs it too). Optional: the app runs the same without them.
#
# An overlay on the app stack (docker-compose.yml: infra.yml and the other parts, same project), not a project of its own: these three reach postgres, redis and
# pgbouncer by service name, so they must share the app's network, which is also why they wait on those services' health. Each publishes a host port, which Prometheus
# (another project) scrapes through host.docker.internal.
#
# The rest of the telemetry agents (OTel collector, Promtail, node-exporter, cAdvisor, container-name-mapper) are in observability.yml: none of them dials an app service
# by name (the app pushes to the OTel collector's published port), so Docker Desktop groups them with Grafana rather than with the app.
services:
  # --- Database exporters ---

  # Pool and wait metrics for the PgBouncer alerts (observability/prometheus/alerts.yml).
  pgbouncer-exporter:
    image: prometheuscommunity/pgbouncer-exporter:v0.12.1@sha256:30f31b6c2efdad3647f8182cc7c1a3a19e42bae5d17387694989f969371c230d
    restart: unless-stopped
    init: true
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    read_only: true
    environment:
      PGBOUNCER_EXPORTER_CONNECTION_STRING: postgres://langfuse:langfuse@pgbouncer:6432/pgbouncer?sslmode=disable
    ports:
      - "9127:9127"
    depends_on:
      pgbouncer:
        condition: service_healthy

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:latest
    environment:
      # appdata, not the `postgres` database: --auto-discover-databases does not make the stat_user_tables collectors read other databases
      # (verified), and appdata holds the app's tables. The other pg_stat_* metrics are cluster-wide either way.
      DATA_SOURCE_NAME: postgresql://langfuse:langfuse@postgres:5432/appdata?sslmode=disable
    # Both collectors are opt-in: every distinct query is a series, so stat_statements is capped by `limit` and needs the extension loaded
    # (the postgres service's shared_preload_libraries) or it reports nothing. stat_user_tables needs no extension.
    command:
      - "--collector.stat_user_tables"
      - "--collector.stat_statements"
      - "--collector.stat_statements.include_query"
      - "--collector.stat_statements.limit=25"
    ports:
      - "9187:9187"
    depends_on:
      postgres:
        condition: service_healthy

  redis-exporter:
    image: oliver006/redis_exporter:v1.97.0@sha256:f5f903fbe77571d455ede0453b084d6840bc62fc105efac001034421cab83b99
    environment:
      REDIS_ADDR: redis://redis:6379
    ports:
      - "9121:9121"
    depends_on:
      redis:
        condition: service_healthy

