# A project of its own (not the checkout directory's name): this stack's containers and volumes stay apart from the app project's (docker-compose.yml),
# so each can be torn down without orphaning the other.
name: agent-core-observability

# The observability backends (`make obs-up`): Prometheus, Alertmanager, Loki, Pyroscope and Grafana, and the agents that feed them (OTel collector, Promtail,
# node-exporter, cAdvisor, container-name-mapper). Only the three database exporters feed them from the app's project (collectors.yml), because they dial
# postgres, redis and pgbouncer by name. Optional: with every container here down the app runs as before, with nowhere for metrics and logs to go.
#
# No shared Docker network with the app stack, so `make up` and `make obs-up` work in either order. They meet through the host: Prometheus scrapes
# the collectors' published ports via `host.docker.internal` (Docker Desktop resolves it; `extra_hosts: host-gateway` does on native Linux),
# the app pushes its metrics to the OTel collector's published port the same way, and Promtail pushes to Loki's. A service that needs an app service's
# NAME belongs in collectors.yml, not here (tests/core/test_compose_layout.py).
services:
  prometheus:
    image: prom/prometheus:v3.16.0@sha256:e04987641b57704f408e31f6373ba4138ecf27cb4a165d24aabb6c38fddd0f06
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=15d"
    ports:
      - "9090:9090"

  alertmanager:
    image: prom/alertmanager:v0.35.1@sha256:4e3d029e69c7f61dd53a2b31a3dc427a2b81736cffca185c0854075e07969e36
    volumes:
      - ./observability/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager:/alertmanager
    command:
      - "--config.file=/etc/alertmanager/alertmanager.yml"
    ports:
      - "9093:9093"

  loki:
    image: grafana/loki:3.7.10@sha256:b43c257ccfc925d4a50b8717cac61a3b51df8c48d01847936057e5c4075a24a7
    command: ["-config.file=/etc/loki/loki-config.yaml"]
    volumes:
      - ./observability/loki/loki-config.yaml:/etc/loki/loki-config.yaml:ro
      - loki:/loki
    ports:
      - "3100:3100"

  # Distributed tracing (app/core/spans.py): the collector writes, Grafana reads (observability/tempo/tempo.yaml). Seven days, no host port.
  tempo:
    image: grafana/tempo:3.1.1@sha256:64e2fbd56d9c2b3412a4b430a58ea59e91a670b1e75f920a0c702213ad145044
    command: ["-config.file=/etc/tempo/tempo.yaml"]
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    volumes:
      - ./observability/tempo/tempo.yaml:/etc/tempo/tempo.yaml:ro
      - tempo:/var/tempo

  # Continuous profiling (specs/022): the app pushes CPU profiles here (PYROSCOPE_SERVER_ADDRESS in app.yml's `x-app-env`) and
  # Grafana reads them through the Pyroscope datasource. The two flags keep this 2.x server on the v1 write path (2.0 release notes): ready in
  # 19 s instead of ~3 minutes (earlier pushes are dropped silently) and 38 MiB idle instead of 97. Seven days of profiles; one writable volume, /data.
  pyroscope:
    image: grafana/pyroscope:2.3.2@sha256:78c3b509f2ad98a6974b38c6f2135d5daf9597809532560e9ca29f9b43aa339e
    command:
      - "-config.file=/etc/pyroscope/config.yaml"
      - "-architecture.storage=v1"
      - "-write-path=ingester"
      - "-compactor.blocks-retention-period=168h"
    init: true
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    read_only: true
    tmpfs:
      - /tmp:size=64m
    volumes:
      - pyroscope:/data
    ports:
      - "4040:4040"   # the app containers push here (via host.docker.internal); a browser can open it too

  grafana:
    image: grafana/grafana:13.3.2@sha256:81556409ba48b2b922e0adb69a2511337d8ba7578f11962eefa6149a2d815101
    ports:
      - "3300:3000"   # 3000 is Langfuse's
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "true"    # local-demo convenience, like open-webui's WEBUI_AUTH=false
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana:/var/lib/grafana
    depends_on:
      - prometheus
      - loki

  # --- Telemetry collectors: what feeds the backends above (moved here from collectors.yml). None of them dials an app service by name, so they need no shared network ---

  # --- Metrics ---

  # What the app pushes its OTel metrics to (OTEL_EXPORTER_OTLP_ENDPOINT in app.yml's `x-app-env`).
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.166.0@sha256:3e18fe04181de50bdd72e23ad4a4d6214b54351e63d496f1c58127cc4541ad7f
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    volumes:
      - ./observability/otel-collector/config.yaml:/etc/otelcol-contrib/config.yaml:ro
    ports:
      - "4317:4317"   # OTLP gRPC (unused by the app; for any other client)
      - "4318:4318"   # OTLP HTTP: what app/platform/telemetry.py pushes to
      - "8889:8889"   # its Prometheus exporter, scraped by Prometheus

  # --- Host and container resources, for the "Docker and system monitoring" dashboard (grafana.com 16310;
  # observability/grafana/dashboards/docker-system-monitoring.json). On Docker Desktop for Mac both report its hidden Linux VM, not the Mac. ---

  node-exporter:
    image: prom/node-exporter:v1.13.1@sha256:7296504d4ada44b7d7ab4431e27e9f9900d8488f8d55842f4b12ae2704e16dfe
    pid: host
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
      - textfile_collector:/textfile-collector:ro
    command:
      - "--path.procfs=/host/proc"
      - "--path.sysfs=/host/sys"
      - "--path.rootfs=/rootfs"
      - "--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)"
      - "--collector.textfile.directory=/textfile-collector"
    ports:
      - "9100:9100"

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.55.1@sha256:3de2bd5203120b866d74a9b283b2ffb8ec382fbf9dc321814700c6ea6f44ec57
    # No /dev/kmsg mount (the usual recipe): the path is absent in Docker Desktop's VM and crash-loops cAdvisor on Mac. The cost is no OOM-event metrics.
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    # Docker Desktop for Mac: cAdvisor 0.54.1+ needs containerd for container names, and Docker Desktop's lives inside its VM
    # (google/cadvisor#3772, open), so its metrics stay keyed by cgroup id. container-name-mapper supplies id -> name. Native Linux has no gap.
    ports:
      - "8081:8080"   # 8080 is open-webui's

  # id -> name for cAdvisor's cgroup-id metrics; the dashboard joins `container_id_name_map` onto them, which also filters its $container selector.
  container-name-mapper:
    image: docker:cli
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./observability/textfile-collectors/container-name-map.sh:/container-name-map.sh:ro
      - textfile_collector:/textfile-collector
    entrypoint: ["/bin/sh", "/container-name-map.sh"]

  # --- Logs ---

  # Ships the app's container logs to Loki through its published port. The config keeps to this app's services: docker_sd sees every container
  # on the host, and old logs from an unrelated project made Loki reject whole batches.
  promtail:
    image: grafana/promtail:3.6.11@sha256:a761cb834cfaeee29745440d4884d6748f0a08d8f68928db1d707018c1dcfbe9
    command: ["-config.file=/etc/promtail/promtail-config.yaml"]
    volumes:
      - ./observability/promtail/promtail-config.yaml:/etc/promtail/promtail-config.yaml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"   # so the Loki address resolves on native Linux Docker too

  # --- SonarQube Community (profile `quality`; `make sonar-up`) ---
  # A persistent server with history and trends. Local on purpose: its quality gate judges NEW code against the last analysis, so a server that
  # starts fresh for each CI run has nothing to compare with and passes everything (ENGINEERING_PATTERNS.md pattern 107).
  # Opt-in for its memory cost (2 GB+ heap). Own Postgres, since SonarQube migrates its schema on upgrade.
  sonarqube-db:
    image: postgres:16
    profiles: ["quality"]
    restart: unless-stopped
    environment:
      POSTGRES_USER: sonarqube
      POSTGRES_PASSWORD: sonarqube
      POSTGRES_DB: sonarqube
    volumes:
      - sonarqube-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sonarqube"]
      interval: 10s
      timeout: 5s
      retries: 10

  sonarqube:
    image: sonarqube:26.10.0.133078-community@sha256:f95aaa9016dd4e92c7d70691167a6d96dbb5d8acffd61eba1cb4335d364a7840
    profiles: ["quality"]
    restart: unless-stopped
    ports:
      - "9002:9000"   # not 9000/9001 — this stack's own minio already binds both of those host ports
    environment:
      SONAR_JDBC_URL: jdbc:postgresql://sonarqube-db:5432/sonarqube
      SONAR_JDBC_USERNAME: sonarqube
      SONAR_JDBC_PASSWORD: sonarqube
    volumes:
      - sonarqube-data:/opt/sonarqube/data
      - sonarqube-extensions:/opt/sonarqube/extensions
      - sonarqube-logs:/opt/sonarqube/logs
    depends_on:
      sonarqube-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9000/api/system/status | grep -q '\"status\":\"UP\"'"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 60s

volumes:
  textfile_collector:
  prometheus:
  alertmanager:
  loki:
  grafana:
  pyroscope:
  tempo:
  sonarqube-db:
  sonarqube-data:
  sonarqube-extensions:
  sonarqube-logs:
