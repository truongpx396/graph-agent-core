# Dev stack, part of docker-compose.yml: what the agent's tools run on. The crawler starts with `make up`; the OpenSandbox server is the `sandbox` profile
# (`make sandbox-up`). Production runs neither: CRAWL4AI_SERVER_URL and OPENSANDBOX_MCP_DOMAIN stay empty there and the tools are absent
# (deploy/README.md, "The crawler's network", is the precondition for ever running the crawler).

services:
  # --- crawl4ai's official server (headless Chromium, warm and pooled; pattern 50) instead of a browser launch per tool call in the app.
  # Default profile: it needs no host Docker socket, only a published port. ---
  crawl4ai:
    image: unclecode/crawl4ai:0.9.3
    shm_size: 1g   # Chromium needs real /dev/shm — crawl4ai's own docker run docs
    # Its own network (PRODUCTION_REVIEW.md R20): the headless browser follows redirects and loads sub-resources by itself, after the app checked only the first URL,
    # so a page can send it to `http://qdrant:6333` or `http://litellm:4000`. On `default` it would reach them; here it reaches only what a bridge network reaches
    # (the internet, and the host through its published port). The app roles that call it join this network too (`x-crawler-network`). deploy/README.md,
    # "The crawler's network", is the precondition for ever running it in production.
    networks: [crawler]
    ports:
      - "11235:11235"   # verified official default port (self-hosting.md), NOT 8000
    environment:
      # Required since 0.9.0 (secure by default): without it the server binds loopback inside its container and the published port resets.
      CRAWL4AI_API_TOKEN: ${CRAWL4AI_API_TOKEN:-}
    healthcheck:
      # The image ships curl; /health needs no auth.
      test: ["CMD", "curl", "-f", "http://localhost:11235/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s   # crawl4ai's own docs: allow up to 40s startup

  # --- OpenSandbox server for every domain's sandbox tools (app/adapters/outbound/mcp/sandbox_tools.py, pattern 50). Upstream publishes no image, so this
  # repo builds one (deploy/images/opensandbox-server.{Dockerfile,toml}). Own opt-in `sandbox` profile (`make sandbox-up`): it bind-mounts the Docker
  # socket to start sibling sandbox containers on the host daemon, the privilege `uvx opensandbox-server` had as a host process. ---
  opensandbox-server:
    build:
      context: .
      dockerfile: deploy/images/opensandbox-server.Dockerfile
    profiles: ["sandbox"]
    restart: unless-stopped
    ports:
      - "8090:8090"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - opensandbox-data:/data
    environment:
      # Overrides server.api_key; current releases refuse to start non-interactively without one.
      OPENSANDBOX_SERVER_API_KEY: ${OPENSANDBOX_API_KEY}

# The network the crawler is alone on; app.yml's `x-crawler-network` puts the roles that call it on this one and on `default`.
# `default` is spelled out because declaring any network here stops compose creating it implicitly only when it is not named; naming it keeps the stack as it was.
networks:
  default: {}
  # No `internal: true`: the crawler's whole job is the internet. What isolates it is that nothing else is on it (deploy/README.md, "The crawler's network").
  crawler: {}

volumes:
  opensandbox-data:
