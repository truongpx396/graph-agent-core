# LiteLLM proxy configuration.
# Demonstrates: model aliases/routing, chat + embedding models, retries,
# fallbacks, and shipping every call to Langfuse from the proxy itself.
#
# Three chat tiers, each a gateway ALIAS (the app names aliases, never a provider's model id):
#
#   tier    alias         dev (this file)                       to use another model
#   easy    chat          gemini-3.5-flash-lite, free tier      edit that ONE entry; prod: LLM_*
#   medium  chat-medium   gemini-3-flash-preview, free tier     edit that ONE entry; prod: LLM_MEDIUM_*
#   strong  chat-strong   gemini-3.6-flash, free tier           edit that ONE entry; prod: LLM_STRONG_*
#
# `chat` is every turn's model; `chat-medium` and `chat-strong` are the router's two escalation targets (MEDIUM_CHAT_MODEL, STRONG_CHAT_MODEL; off
# by default, and a delegated specialist can name either in its AGENT.md `model:`). All three need GOOGLE_API_KEY in `.env`. Without it, or when
# Google refuses a call (its free quota is per minute and per day), `chat` is answered by the local `chat-backup` (see `fallbacks` below): slow,
# and visible only in the spend log (Admin UI, Logs: model group `chat-backup`). The app and its traces still say `chat`.
# FREE TIER, DEV DATA ONLY: Google's pricing page says free-tier content is used to improve its products, and EVERY turn now sends the whole
# conversation, retrieved documents and tool results. Use sample data. Quotas are small, set per project and per model (AI Studio shows them).
#
# WHY THESE MODELS (measured on this project's key, 2026-11-28, a handful of calls each; a snapshot, not a promise):
#   gemini-3.5-flash-lite 10/10 answered in about 0.8 s    <- `chat`
#   gemini-3.1-flash-lite  5/10 (503 "high demand", timeouts)
#   gemini-3-flash-preview 6/6 in 1.4-2.5 s                <- `chat-medium` (a preview model: Google may withdraw it)
#   gemini-3.6-flash       5/6                             <- `chat-strong`
#   gemini-3.8-flash       0/6
#   gemini-4-hydrogen      4/6, and on this LiteLLM image it answers 400 to a replayed tool call another model made, which fails the turn
#
# PRICES. Every alias below states a price in `model_info`. A local model costs no money, but without a price LiteLLM reports it as
# either unknown (`null`: the app counts every call as unpriced and `UNPRICED_MODEL_POLICY=block` would refuse it) or a known $0 (and a
# model whose two prices are both 0 skips budget checks, per LiteLLM's budget docs, so neither the app key's `max_budget` nor the per-person
# budget below could ever trip on it; measured on the 1.94.1 image before this change: chat, chat-backup and embed reported 0, vision null).
# These are SHADOW prices, not a bill (USD per token: 0.0000001 is $0.10 per million): the paid-tier list price for a hosted model, and for a
# local one the order of magnitude hosted providers charge for open weights of that size. They make the meter, the caps and LiteLLM's own spend
# log see usage as non-zero. YAML note: write decimals, because PyYAML reads `1e-7` as a string. Two aliases on one underlying model should
# state the same price (a deployment with none inherits it).

model_list:
  # Tier "easy": the model every turn uses unless the router picks another. `gemini/` is LiteLLM's own Google AI Studio provider: it carries
  # Gemini's thought signatures from one tool call to the next, which Google's OpenAI-compatible endpoint would make the app carry itself.
  - model_name: chat
    litellm_params:
      model: gemini/gemini-3.5-flash-lite
      api_key: os.environ/GOOGLE_API_KEY
      # Go to `chat-backup` at once: gateway retries on a free tier multiply the app's own (3 attempts) and spend Google's quota.
      num_retries: 0
      # A hung call must leave the fallback time to answer inside the app's 60 s turn (REQUEST_TIMEOUT_SECONDS). A normal one takes 1-2 s.
      timeout: 20
    model_info:
      input_cost_per_token: 0.0000003
      output_cost_per_token: 0.0000025
  # `chat`'s fallback target, and the local model (`make probe-tools ARGS="--alias chat-backup"`). NOTE: use the `ollama_chat/` provider (not
  # `ollama/`) — it hits Ollama's /api/chat endpoint with *native* tool calling. The plain `ollama/` provider fakes tools via prompt injection
  # and loops on tool use.
  #
  # The model is qwen2.5:7b, not the 3b this file used to name, because of what each does with this app's tool calls
  # (`python -m scripts.checks.toolcall_probe`, 25 labelled prompts against the app's real tools and system prompt, temperature 0):
  # the 3b answered 8/19 correctly at the old repeat_penalty 1.3, 13/19 at 1.1 and 15/19 even at 1.0, the misses mostly silently dropped by Ollama
  # (the model wrote malformed JSON, Ollama's parser discards a call it cannot read, and the graph sees an empty reply);
  # the 7b answers 19/19 at 1.1 or 1.0. See GRAPH_PATTERNS.md pattern 73 and the repeat_penalty note below.
  - model_name: chat-backup
    litellm_params:
      model: ollama_chat/qwen2.5:7b
      # host.docker.internal: this targets a native macOS Ollama on the
      # host, not a docker-compose container — there is no containerized
      # Ollama in this stack. Docker Desktop on Mac can't pass Metal/GPU
      # through to a container, so a containerized Ollama would run
      # CPU-only — verified empirically at ~9x slower per-turn (10.76s vs
      # 1.18s total on a 575-token RAG-sized prompt, same model, warm) than
      # the native install hitting GPU ("100% GPU" per `ollama ps`).
      # open-webui (docker-compose.yml) also points at this same host
      # Ollama, so every model only needs to be pulled once, natively.
      api_base: http://host.docker.internal:11434
      # Ollama's own runtime default (verified via `ollama ps`: 4096, NOT
      # the 32768 qwen2.5 actually supports per `ollama show`, 3b and 7b alike) — nothing
      # here overrode it before, and it was tight enough to matter: the
      # system prompt + tool schemas ALONE measure ~2300+ input tokens on a
      # bare first call (real usage_metadata), leaving very little room for
      # retrieved context, conversation history, and a multi-round
      # tool-calling/retry loop within one turn before either silent
      # truncation or a hard error. LiteLLM's ollama_chat provider passes
      # `num_ctx` straight through to Ollama's own `options.num_ctx`
      # (verified in its transformation.py) — a config change, not a code
      # change, per this file's own model-alias architecture.
      # app/agent/graph/core.py's HISTORY_TOKEN_CEILING/FLOOR are sized against
      # this exact number — change both together. 32000 is right up
      # against qwen2.5's own rated max (32768 per `ollama show`) —
      # real headroom (768 tokens), not a round-number guess.
      num_ctx: 32000
      # Bounds a SINGLE completion's own length — a real, reproduced gap
      # without this: an open-ended "showcase many examples" prompt sent
      # qwen2.5:3b into a verbatim repetition loop (a known small-model
      # failure mode) that ran until app/core/config.py's
      # REQUEST_TIMEOUT_SECONDS (60s wall-clock) finally killed the whole
      # turn — nothing bounded the call itself by output length, only by
      # time. `num_predict`, Ollama's own max-output-tokens option
      # (LiteLLM's ollama_chat provider passes it straight through, same
      # as num_ctx above), cuts a runaway generation off after a token
      # count instead, in a few seconds rather than the full minute — 2048
      # is generous for this app's own concise assistant answers (a real
      # multi-paragraph reply with a code sample rarely clears a few
      # hundred tokens) while still firmly bounding the worst case.
      # `repeat_penalty` is Ollama's own default, 1.1, and must stay near it. This
      # used to be 1.3 ("a commonly-used value for reducing verbatim repetition"),
      # and 1.3 is what broke tool calling: the penalty falls on tokens already in
      # the context, and a tool call's `":` and quote tokens are in it dozens of
      # times, so the model drifts off the JSON. Measured with
      # scripts/checks/toolcall_probe.py: qwen2.5:7b answered 11/19 tool-needing prompts
      # at 1.3 (the rest came out as fragments like `brtc {"name": "calculator"...`)
      # and 19/19 at 1.1 and at 1.0; qwen2.5:3b dropped 8 of 22 replies outright at
      # 1.3 (Ollama discards a call whose JSON it cannot parse, with no error).
      # The repetition loop 1.3 was added against is a 3b failure: at 1.1 the 3b
      # looped to the 2048-token cap on "list every kind of database index" (44%
      # of 6-word runs repeated); the 7b ended all four open-ended prompts it was
      # tried on by itself, at 1.1 and at 1.0 (at most 10% repeats). So the model
      # is what fixed the loop, and `num_predict` still bounds the worst case.
      # Do not change it without running `make probe-tools` (it checks both halves: tool calls and loops).
      num_predict: 2048
      repeat_penalty: 1.1
    # The same price as `chat`: a fallback must not change what a call is priced at (the app prices by the alias it asked for).
    model_info:
      input_cost_per_token: 0.0000003
      output_cost_per_token: 0.0000025
  # Tier "medium": between `chat` and `chat-strong`. The router sends analysis and code work here. Ollama's options (`num_ctx`,
  # `repeat_penalty`) do not apply. NO `fallbacks` entry names it, on purpose: a gateway fallback would price a call at the model that did not
  # answer it (the same reason `chat-strong` has none).
  - model_name: chat-medium
    litellm_params:
      model: gemini/gemini-3-flash-preview
      api_key: os.environ/GOOGLE_API_KEY
      num_retries: 0
    # Shadow price at the paid-tier list price: $0.50 per million input tokens, $3.00 per million output.
    model_info:
      input_cost_per_token: 0.0000005
      output_cost_per_token: 0.000003
  # The escalation alias (specs/014, contracts/gateway-aliases.md section 1): where the model router sends a turn it judges to need a stronger
  # model (reasoning and high-stakes questions). ALWAYS present so the proxy starts and the alias resolves; INERT until the app is told to use it
  # (STRONG_CHAT_MODEL, ROUTER_MODE, both off by default). Pro-class Gemini models have no free tier. To point it elsewhere, edit this one entry:
  # a model with native tool calls, `stream_options.include_usage` and a context window of at least 32000. NO `fallbacks` entry names it, on
  # purpose: the app repeats a failed strong call on `chat` itself, so the usage ledger prices the model that answered.
  - model_name: chat-strong
    litellm_params:
      model: gemini/gemini-3.6-flash
      api_key: os.environ/GOOGLE_API_KEY
      num_retries: 0
    # Shadow price at the paid-tier list price through 2026-12-31 ($1.50 / $7.50 from 2027-01-01): $0.75 per million input tokens, $3.75 output.
    model_info:
      input_cost_per_token: 0.00000075
      output_cost_per_token: 0.00000375
  # Vision-capable alias slot (GRAPH_PATTERNS.md pattern 44). The local chat model
  # (`chat-backup`) has no vision capability, so an attached image reaching it is carried
  # through the pipeline correctly but it can't see it. The hosted model behind `chat`
  # accepts images; that has not been tried through this app.
  #
  # IMPORTANT, verified empirically: neither small local Ollama vision
  # model this session tried (moondream, qwen2.5vl:3b — both pulled and
  # tested directly against this deployment's real Ollama) supports
  # Ollama's native tool-calling ("does not support tools", from Ollama
  # itself) — and make_graph_node_agent's agent() always binds this app's tools
  # to CHAT_MODEL regardless of whether a given turn attaches an image, so
  # BOTH failed through this app's actual agent loop despite each working
  # correctly called directly (outside this app, with no tools bound).
  # This alias is left pointed at qwen2.5vl:3b as a ready-made slot, not
  # a working default — genuinely exercising real image understanding
  # through this app's tool-bound agent needs either a larger local model
  # Ollama might support tool+vision on, or (more reliably today) a real
  # cloud-hosted OpenAI-compatible vision endpoint substituted for
  # OPENAI_API_BASE — a config change, not a code change, thanks to this
  # app's model-alias architecture (pattern 38).
  - model_name: vision
    litellm_params:
      model: ollama_chat/qwen2.5vl:3b
      api_base: http://host.docker.internal:11434
      # Same runaway-generation guard as "chat" above — same underlying
      # small-model risk, independent of whether an image is attached.
      num_predict: 2048
      repeat_penalty: 1.3
    # A 3B-class model, priced below `chat`: $0.05 per million input tokens, $0.10 per million output. It was the only local alias with no
    # price at all (null), so a vision call was unpriced where a chat call was a known $0.
    model_info:
      input_cost_per_token: 0.00000005
      output_cost_per_token: 0.0000001
  # Embedding model (alias "embed" -> Ollama nomic-embed-text)
  - model_name: embed
    litellm_params:
      model: ollama/nomic-embed-text
      api_base: http://host.docker.internal:11434
    # An embedding has no output tokens, so only the input is priced: $0.01 per million. Embeddings are not metered by the app yet
    # (COST_GOVERNANCE.md pattern 26), so this is what LiteLLM's own spend log and the app key's budget see of them.
    model_info:
      input_cost_per_token: 0.00000001
      output_cost_per_token: 0.0

litellm_settings:
  drop_params: true                    # silently drop params Ollama doesn't support (e.g. encoding_format)
  num_retries: 2                       # retry transient failures
  # Longer than the production file's 120 on purpose: a local model on CPU can take minutes to send its first token, and the live tests give a
  # turn 420 s. Three layers retry (the app's SDK, off by default; the graph's policy, 3 attempts; this proxy, 2) and multiply: see
  # deploy/prod/litellm-config.yaml, which is where the timeout was lowered.
  request_timeout: 600
  # If "chat" fails (no key, quota, "high demand", a hang), transparently answer on "chat-backup".
  fallbacks: [{"chat": ["chat-backup"]}]
  # A default per-PERSON spend cap at the gateway (COST_GOVERNANCE.md pattern 74). The app sends every call with `user` =
  # `tenant:<tenant>/user:<principal>` (app/core/gateway.py), which LiteLLM keeps as the call's END USER (its Customer Usage view filters
  # by it); this names a budget OBJECT that applies to every end user without a budget of its own, including ones LiteLLM has not seen
  # yet. The id is only a name: the budget itself lives in LiteLLM's database and is created with
  # `make litellm-key ARGS="person-budget set --max-budget <usd>"`. Until that is run LiteLLM finds no such budget, logs "Default end
  # user budget not found in database" on each call and applies NO per-person cap (it fails open). It caps each PERSON, so a tenant
  # with many people can spend many times it: the tenant's own limits are the app's. It is a backstop above the app's own limits (size
  # it above your largest person's legitimate spend), not a copy of them, and it covers chat calls only: embeddings carry no end user
  # yet. Keep it equal to scripts/tools/litellm_key.py's PERSON_BUDGET_ID (a test checks).
  max_end_user_budget_id: person-default
  # Log every request/response to Langfuse from the proxy layer, and expose
  # LiteLLM's own built-in request/latency/token metrics for Prometheus to
  # scrape at GET /metrics (see deploy/dev/observability.yml's
  # prometheus service — this is a separate metrics surface from this
  # app's own OTel metrics in app/core/metrics.py, at the proxy layer
  # rather than the agent layer).
  success_callback: ["langfuse", "prometheus"]
  failure_callback: ["langfuse", "prometheus"]
  # /metrics requires a LiteLLM API key by default (v1.85.0+) — disabled
  # here for local scraping simplicity; a real deployment would instead
  # keep auth on and configure Prometheus's scrape config with a
  # bearer_token pointing at a real LiteLLM key.
  require_auth_for_metrics_endpoint: false

general_settings:
  master_key: sk-anything              # matches OPENAI_API_KEY in .env
  # Without this, the Admin UI's Observability->Logs page only shows
  # metadata (model, tokens, cost, latency, status) in LiteLLM_SpendLogs —
  # the actual request/response bodies are omitted by default. This makes
  # each log row expandable to the full messages array sent and the raw
  # completion returned. Development only: the production file sets it false, because bodies are prompt text, kept with no retention (R16).
  store_prompts_in_spend_logs: true
