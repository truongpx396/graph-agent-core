# The dev stack (`make up`): one compose project made of the parts under `include`. This file only names them, so a new service never touches it; deploy/prod/ has the same layout.
#
#   infra.yml     the backing services the app calls: Postgres, PgBouncer, Redis, Qdrant, MinIO, LiteLLM, Langfuse, Open WebUI
#   app.yml       what this repo builds: the ML service; profile `app` (`make up-app`) the API and workers; profile `gateway` the MCP gateway
#   tools.yml     what the agent's tools run on: the crawler; profile `sandbox` (`make sandbox-up`) the OpenSandbox server
#   gateway.yml   the front door, profile `gateway` (`make front-door-up`): Caddy, authlimit, Casdoor
#
# Run from this directory but not part of the project:
#   observability.yml   its own project (`make obs-up`): Prometheus, Alertmanager, Loki, Pyroscope, Grafana, and SonarQube under profile `quality` (`make sonar-up`)
#   collectors.yml      an overlay (`make collectors-up`): exporters, OTel collector, cAdvisor, Promtail; they need this project's network
#   loadtest.yml        an overlay (`make loadtest-app-up`): points the containerized app at the fake LLM
#
# The Telegram bot is a container here too (profile `telegram`, `make telegram-up`) or a host process (`make telegram`): the front door's Caddy sends /telegram/* to whichever runs.
# An overlay added through COMPOSE_OVERLAYS, not part of the project: hosted-llm.yml (a hosted LLM instead of the host's Ollama; the dev droplet, `make droplet-up`).
#
# Every path in these files, the `include` paths too, is relative to the REPO ROOT, so run compose with `--project-directory .` (the Makefile's COMPOSE does). Without it the first
# `include` fails with "no such file"; the old single file silently took the wrong project name and orphaned the volumes. `.env` and any `--env-file` reach every part.
include:
  - path: ./deploy/dev/infra.yml
    project_directory: .
  - path: ./deploy/dev/app.yml
    project_directory: .
  - path: ./deploy/dev/tools.yml
    project_directory: .
  - path: ./deploy/dev/gateway.yml
    project_directory: .
