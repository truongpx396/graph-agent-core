# The dev stack (`make up`): ONE compose project made of the parts under `include`, each a file in this directory that says what it holds. This file only
# names the parts, so adding a service never touches it. deploy/prod/ is the same layout for the droplets.
#
#   infra.yml     the backing services the app calls: Postgres, PgBouncer, Redis, Qdrant, MinIO, LiteLLM, Langfuse, Open WebUI
#   app.yml       what this repo builds: the ML service; profile `app` (`make up-app`) the API and the workers; profile `gateway` the MCP gateway
#   tools.yml     what the agent's tools run on: the crawler; profile `sandbox` (`make sandbox-up`) the OpenSandbox server
#   gateway.yml   the front door, profile `gateway` (`make mcp-gateway-up`): Caddy, authlimit, Casdoor
#
# The Telegram bot is not a service here: in dev it runs on the host (`make telegram`, `telegram-support`, `telegram-sales`) and the front door's Caddy sends
# /telegram/* to it (deploy/dev/caddy/Caddyfile). In production it is a container (deploy/prod/app.yml, profile `telegram`), and production has no tools.yml.
#
# Run from this directory but NOT part of this project:
#   observability.yml   a project of its own (`make obs-up`): Prometheus, Alertmanager, Loki, Pyroscope, Grafana; and SonarQube, profile `quality` (`make sonar-up`)
#   collectors.yml      an overlay on this project (`make collectors-up`): the exporters, the OTel collector, cAdvisor, Promtail; they need this project's network
#   loadtest.yml        an overlay (`make loadtest-app-up`): points the containerized app roles at the fake LLM
#
# Every path in these files is relative to the REPO ROOT, the `include` paths below too, so compose must run with `--project-directory .` (the Makefile's
# COMPOSE does; it also makes `.env` and the project name come from the root). Without it the first `include` fails with "no such file", which is the
# signal: the old single file silently took the wrong project name and orphaned the volumes. `project_directory: .` keeps each part's own bind
# mounts (`./postgres-init`, `./deploy/dev/...`) relative to the root as well, and `.env` and any `--env-file` reach every part.
include:
  - path: ./deploy/dev/infra.yml
    project_directory: .
  - path: ./deploy/dev/app.yml
    project_directory: .
  - path: ./deploy/dev/tools.yml
    project_directory: .
  - path: ./deploy/dev/gateway.yml
    project_directory: .
