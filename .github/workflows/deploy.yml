name: Deploy

# Runs images CI already built, scanned and published for a commit on main. It never starts by itself: ci.yml calls it as the last job of that
# same run (so a deploy can only follow that run's checks), and a maintainer can start it by hand to redeploy or roll back. It used to run on
# `workflow_run`, whose `branches:` filter matches the NAME of the triggering run's branch: a pull request from a fork's `main` passed it and got
# this repository's token and secrets (ENGINEERING_PATTERNS.md pattern 106). zizmor (`make lint-workflows`) refuses that trigger.
#
# The automatic deploy is off until the repository variable DEPLOY_ENABLED is `true`. Terraform is not run here: creating droplets stays a
# human-run `terraform apply`, and this only updates what runs on droplets that already exist.
#
# Secrets, in the `production` environment (deploy/README.md has the setup):
#   DROPLET_HOST, OBS_DROPLET_HOST  the two reserved IPs (`terraform output`)
#   DEPLOY_SSH_KEY                  the private half of terraform's deploy_ssh_public_key, authorized on both droplets
#   DEPLOY_KNOWN_HOSTS              both droplets' host keys. Pinned: scanning at deploy time would trust whatever answers on that address
on:
  workflow_call:
    inputs:
      image_tag:
        description: "Commit SHA whose images to run"
        required: true
        type: string
    # Named so the caller can pass repository secrets; an environment secret of the same name wins.
    secrets:
      DROPLET_HOST: { required: false }
      OBS_DROPLET_HOST: { required: false }
      DEPLOY_SSH_KEY: { required: false }
      DEPLOY_KNOWN_HOSTS: { required: false }
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Full commit SHA on main whose images CI published (redeploy, or roll back)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  guard:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      packages: read
    env:
      IMAGE_TAG: ${{ inputs.image_tag }}
    steps:
      # The jobs below check this commit out and run its files with the deploy key, so it must be one that was reviewed into main.
      - name: The tag is a full SHA of a commit on main
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          [[ "$IMAGE_TAG" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::image_tag must be a full commit SHA"; exit 1; }
          status=$(gh api "repos/$REPO/compare/$IMAGE_TAG...main" --jq .status)
          case "$status" in
            ahead | identical) ;;
            *) echo "::error::$IMAGE_TAG is not a commit on main (compare says: $status)"; exit 1 ;;
          esac

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Before anything on a droplet changes: a missing image would otherwise be found after the new config was already synced.
      - name: All four images were published for this commit
        env:
          OWNER: ${{ github.repository_owner }}
        run: |
          for image in graph-agent-core graph-agent-core-ml-service graph-agent-core-authlimit graph-agent-core-web; do
            docker buildx imagetools inspect "ghcr.io/$OWNER/$image:$IMAGE_TAG" > /dev/null
          done

  app:
    needs: guard
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    # One release at a time; a newer one waits for this one instead of overlapping it.
    concurrency:
      group: deploy-app
      cancel-in-progress: false
    permissions:
      contents: read
      packages: read
    env:
      IMAGE_TAG: ${{ inputs.image_tag }}
      DROPLET_HOST: ${{ secrets.DROPLET_HOST }}
    steps:
      # The compose files, configs and release script of the SAME commit as the images, so a rollback rolls all of them back.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.image_tag }}
          persist-credentials: false

      - uses: ./.github/actions/ssh-setup
        with:
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          known-hosts: ${{ secrets.DEPLOY_KNOWN_HOSTS }}

      # GHCR packages pushed with GITHUB_TOKEN are private, so the droplet logs in with this job's own token (it expires with the job). Over
      # stdin: on the command line it would show in the droplet's process list.
      - name: Log the droplet in to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
        run: |
          # shellcheck disable=SC2029  # $ACTOR is meant to expand here, on the runner
          printf '%s' "$GHCR_TOKEN" | ssh "$DROPLET_HOST" "docker login ghcr.io -u '$ACTOR' --password-stdin"

      # Config and compose files only, never .env: secrets live only on the droplet, created once by hand. `-R` keeps each file's repo path, so
      # the droplet mirrors the repo and the compose files' root-relative paths resolve there as they do here. A file the entry includes and
      # this list misses fails `docker compose` at parse time (tests/core/test_release_pipeline.py compares the two).
      # `--delete` is scoped to the two directories, never the target root, so it cannot touch the operator's .env.
      - name: Sync compose and config files to the droplet
        run: |
          rsync -azR \
            deploy/prod/docker-compose.yml deploy/prod/infra.yml deploy/prod/app.yml \
            deploy/prod/gateway.yml deploy/prod/collectors.yml deploy/prod/tools.yml \
            deploy/prod/compose.sh deploy/prod/release.sh deploy/prod/crawler-firewall.sh \
            deploy/prod/caddy/Caddyfile deploy/shared/caddy/gateway.caddyfile deploy/shared/caddy/redacted-format.caddyfile \
            deploy/prod/litellm-config.yaml \
            "$DROPLET_HOST":/opt/graph-agent-core/
          rsync -az --delete postgres-init/ "$DROPLET_HOST":/opt/graph-agent-core/postgres-init/
          rsync -az --delete observability/ "$DROPLET_HOST":/opt/graph-agent-core/observability/

      # Pull, billing schema check, up, wait for /health/ready through the front door, prune (deploy/prod/release.sh).
      - name: Release
        run: |
          # shellcheck disable=SC2029  # the tag is meant to expand here; the guard job checked it is 40 hex characters
          ssh "$DROPLET_HOST" "cd /opt/graph-agent-core && deploy/prod/release.sh '$IMAGE_TAG'"

      - name: Log the droplet out of GHCR
        if: always()
        run: ssh "$DROPLET_HOST" "docker logout ghcr.io" || true

  # The monitoring stack on its own droplet: off-the-shelf images pinned in deploy/prod/observability.yml, nothing built here.
  observability:
    needs: guard
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    concurrency:
      group: deploy-observability
      cancel-in-progress: false
    env:
      OBS_DROPLET_HOST: ${{ secrets.OBS_DROPLET_HOST }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.image_tag }}
          persist-credentials: false

      - uses: ./.github/actions/ssh-setup
        with:
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          known-hosts: ${{ secrets.DEPLOY_KNOWN_HOSTS }}

      # Never .env here either (GRAFANA_ADMIN_PASSWORD, OBS_DOMAIN_NAME are created by hand on this droplet).
      - name: Sync compose and config files to the droplet
        run: |
          rsync -azR deploy/prod/observability.yml deploy/prod/caddy/Caddyfile.observability "$OBS_DROPLET_HOST":/opt/agent-core-observability/
          rsync -az --delete observability/ "$OBS_DROPLET_HOST":/opt/agent-core-observability/observability/

      # The restart: `up -d` does not recreate a container whose mounted config file alone changed (alert rules, datasources, pipelines).
      - name: Pull new images and restart
        run: |
          ssh "$OBS_DROPLET_HOST" "cd /opt/agent-core-observability && \
            docker compose --project-directory . -f deploy/prod/observability.yml pull && \
            docker compose --project-directory . -f deploy/prod/observability.yml up -d --remove-orphans && \
            docker compose --project-directory . -f deploy/prod/observability.yml restart && \
            docker image prune -af --filter until=168h"
