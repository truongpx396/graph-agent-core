name: OWASP ZAP DAST

# Started by hand only. `baseline` spiders and scans passively; `api-scan` ATTACKS every endpoint in the target's OpenAPI document. Only ever run
# this against a target you own or have written permission to test. It needs a running, reachable app, which CI does not have (deploy/README.md).
# It runs the same make targets as a laptop (make/security.mk), so the ZAP version and report settings are pinned in one place.
#
# With the DEFECTDOJO_URL variable and the DEFECTDOJO_API_KEY secret set, the XML report is also imported into that DefectDojo (its ZAP parser
# needs the XML one: scripts/tools/defectdojo_import.py). Without them that step is skipped; the scan and its artifact do not depend on it.
on:
  workflow_dispatch:
    inputs:
      target:
        description: "Base URL of a RUNNING app you own or have permission to test (https://...)"
        required: true
        type: string
      mode:
        description: "baseline is passive; api-scan ATTACKS, driven by <target>/openapi.json"
        required: true
        default: baseline
        type: choice
        options: [baseline, api-scan]

permissions:
  contents: read

jobs:
  zap:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Inputs reach the script through the environment, never pasted into it: an input is text somebody typed.
      - name: Scan
        env:
          ZAP_TARGET: ${{ inputs.target }}
          MODE: ${{ inputs.mode }}
        run: |
          [[ "$ZAP_TARGET" =~ ^https?://[^[:space:]]+$ ]] || { echo "::error::target must be an http(s) URL"; exit 1; }
          make "zap-$MODE"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: zap-report
          path: zap_reports/
          if-no-files-found: warn

      - name: Import into DefectDojo
        if: always() && vars.DEFECTDOJO_URL != ''
        env:
          DEFECTDOJO_URL: ${{ vars.DEFECTDOJO_URL }}
          DEFECTDOJO_API_KEY: ${{ secrets.DEFECTDOJO_API_KEY }}
        run: |
          pip install httpx==0.28.1
          python3 -m scripts.tools.defectdojo_import --file zap_reports/*.xml --scan-type "ZAP Scan" --engagement-name "ci-run-$GITHUB_RUN_ID"
