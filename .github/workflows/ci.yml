name: CI

# Every pull request and push to main. The branch ruleset requires ONE check, `ci-ok`, which stands for all of this (ENGINEERING_PATTERNS.md
# pattern 107, which also holds the reasoning and history behind the jobs).
#
#   changes -+- lint, config, typecheck, test, billing-package, web, authlimit, openapi, security ------+
#            +- test-integration, test-live, promptfoo, image   (skipped for documentation-only PRs) --+- ci-ok - promote - deploy (main only)
#
# Checks run in parallel (fast feedback is the point); only the release at the end is ordered. Not here, on purpose: deepeval and the red team
# (llm-evals.yml: nightly, they never gate on a score), and `make eval`, garak, Strix and ZAP (a person runs those).
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# A new push to a pull request cancels its older run. Runs on main are never cancelled: each may be the one that releases.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

# Each `timeout-minutes` is at least 2.5x the job's longest healthy run (5 at the least): 28 of 300 runs once had a job stall past 45 minutes
# (tests/core/test_ci_jobs_have_timeouts.py). Re-measure before tightening one.
jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2 # on a pull request HEAD is the merge commit and HEAD^1 its base
          persist-credentials: false
      - id: diff
        name: Does this change anything but documentation?
        env:
          EVENT: ${{ github.event_name }}
        shell: bash
        run: |
          if [ "$EVENT" = pull_request ]; then
            git diff --name-only HEAD^1 HEAD | python3 scripts/tools/ci_gate.py changes | tee -a "$GITHUB_OUTPUT"
          else
            echo "code=true" >> "$GITHUB_OUTPUT"
          fi

  # ruff, then actionlint, zizmor and shellcheck on the workflows and shell scripts.
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-python
        with:
          requirements: requirements-lint.txt
      - run: make lint lint-workflows

  # What only the tool that reads a config knows: whether compose, Prometheus, Alertmanager and Terraform will accept it.
  config:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: make compose-check
      - run: make monitoring-check
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.9.8"
      # Structural only: a `plan` needs the state, which stays off CI (deploy/README.md). Misconfiguration scanning is security.yml's Checkov.
      - name: terraform fmt and validate (each root)
        working-directory: deploy/terraform
        run: |
          terraform fmt -check -diff -recursive
          for root in prod dev; do
            (cd "$root" && terraform init -backend=false && terraform validate)
          done

  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-python
        with:
          requirements: requirements-lock.txt requirements-lint.txt
      # `mypy`, not through make: the Makefile exports PYTHONPATH, and this job proves `mypy_path` is enough without it or an install.
      - run: mypy

  # The hermetic suite: a fake LLM, no live services (tests/conftest.py). Coverage has a floor (pyproject.toml), not a target.
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-python
        with:
          requirements: requirements-lock.txt requirements-test.txt
      # `pytest`, not `make test`: proves `pythonpath` is enough without the Makefile's PYTHONPATH or an install.
      - run: pytest -n auto -q --cov
      - name: Coverage in the run summary
        if: ${{ !cancelled() }}
        run: echo "Line coverage of app/ and the billing package, hermetic tests only - $(coverage report --format=total || true)%" >> "$GITHUB_STEP_SUMMARY"

  # The billing package installed ALONE (spec 011 D20, FR-016): not the lock file, not the app. Passing here proves it depends on nothing undeclared.
  billing-package:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - run: pip install "./packages/billing[test]"
      - name: The agent app is not importable from here
        working-directory: packages/billing
        run: python -c "import importlib.util, sys; sys.exit(1 if importlib.util.find_spec('app') else 0)"
      - run: pytest -q
        working-directory: packages/billing

  # The web client (web/). The API types it is written against are generated from openapi.json, so a contract change not regenerated fails here.
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: The generated API types are openapi.json's (`make web-api` after `make openapi`)
        run: npm run check:api
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  # The authlimit service (specs/018), its own Go module: an in-memory Redis, a fake authorization server, no Docker. Its image is the `image`
  # job's, its known vulnerabilities security.yml's.
  authlimit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: services/authlimit
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The newest 1.26 patch, as the image's tag resolves to: go.mod's `go 1.26.0` would test against a standard library with known holes.
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: "1.26.x"
          check-latest: true
          cache-dependency-path: services/authlimit/go.sum
      - run: go vet ./...
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0
          working-directory: services/authlimit
      - name: go test -race (reads the shared vectors in testdata/auth-vectors)
        run: go test -race -count=1 ./...
      # Routing and body types are GENERATED from openapi.json (internal/api): a document edited without `make authlimit-generate` fails here.
      - name: The generated code is the document's
        run: |
          go generate ./...
          git diff --exit-code -- internal/api

  # Does the change BREAK a client of what main serves? (That the three OpenAPI documents are TRUE is held by tests in `test` and `authlimit`.)
  # A deliberate break is one line in .github/openapi-breaking-ignore.txt and still needs a new major version. Pull requests only: a push to
  # main has no "before".
  openapi:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      BASE_REF: ${{ github.base_ref }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: services/authlimit/go.mod
          cache: false # nothing here is built from this repository's own modules
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0 (scripts.tools.openapi_version is stdlib only)
        with:
          python-version: "3.13"
      # The checkout is the merge of the PR into main, so this compares what main would become with what it is now.
      - name: Fetch main, the side to compare with
        run: git fetch --no-tags --depth=1 origin "+refs/heads/${BASE_REF}:refs/remotes/origin/${BASE_REF}"
      - name: Install oasdiff
        env:
          GOTOOLCHAIN: auto # v1.35.0's go.mod asks for a newer toolchain than the one set up above; Go fetches it
        run: go install github.com/oasdiff/oasdiff@v1.35.0
      - name: Breaking changes against main (and a breaking one needs a new major version)
        run: make openapi-breaking OPENAPI_BASE="origin/${BASE_REF}"
      - name: A changed contract has a higher version than main's
        run: make openapi-version OPENAPI_BASE="origin/${BASE_REF}"

  # Real Postgres, Redis and Qdrant through testcontainers (tests/containers.py), no LLM. Then the billing package's own.
  test-integration:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-python
        with:
          requirements: requirements-lock.txt requirements-test.txt
          billing: "true"
      - run: make test-integration

  # A real small model, the app and its workers, real crawl4ai renders and a Playwright browser run (tests/live/, GRAPH_PATTERNS.md pattern 50).
  # Why three pytest processes and not one: make/test.mk.
  test-live:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      TEST_LLM_MODEL: qwen2.5:3b
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-python
        with:
          requirements: requirements-lock.txt requirements-test.txt
          billing: "true"
      # The page the browser tests drive: the API serves it from web/dist, as the image does.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: make web-build
      - run: playwright install --with-deps chromium
      # The key names BOTH models `ensure_ollama` pulls (chat and nomic-embed-text): deepeval shares it, and must not get a directory with one.
      - id: ollama-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/graph-agent-core-ollama-models
          key: ollama-models-${{ runner.os }}-${{ env.TEST_LLM_MODEL }}-nomic-embed-text
      - run: make test-live-models
      # THE GATE: every browser test that does not need the model to chain calls.
      - run: make test-live-e2e
      # ADVISORY: the two multi-step tests need a 3B model to chain 3+ calls. `!cancelled()`, so one run shows both results.
      - name: Multi-step browser tests (advisory)
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: make test-live-advisory
      # Not actions/cache's post-job save, which cannot read the root-owned files Ollama wrote and is skipped when the job is red.
      - if: ${{ !cancelled() }}
        uses: ./.github/actions/save-ollama-cache
        with:
          key: ${{ steps.ollama-cache.outputs.cache-primary-key }}
          cache-hit: ${{ steps.ollama-cache.outputs.cache-hit }}

  # Black-box regression on the domain system prompts against a small Ollama model (GRAPH_PATTERNS.md pattern 48).
  promptfoo:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PROMPTFOO_MODEL: qwen2.5:1.5b
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-python
        with:
          billing: "true"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - id: ollama
        uses: ./.github/actions/ollama
        with:
          model: ${{ env.PROMPTFOO_MODEL }}
      - run: make promptfoo
      - if: ${{ !cancelled() }}
        uses: ./.github/actions/save-ollama-cache
        with:
          key: ${{ steps.ollama.outputs.cache-primary-key }}
          cache-hit: ${{ steps.ollama.outputs.cache-hit }}

  # One leg per image production runs: build it, show what a build cannot, scan it, and on main publish exactly that build as `:<sha>`
  # (the second build step reuses the first's layers from this runner's builder). `:latest` moves only in `promote`, below. The BuildKit
  # cache has one scope per image: with the shared default scope each image's export overwrote the others', so none was ever reused.
  image:
    name: image (${{ matrix.name }})
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write # used by the two steps that run on a push to main only
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: app, context: ., repository: graph-agent-core, category: trivy-image }
          - { name: ml-service, context: services/ml-service, repository: graph-agent-core-ml-service, category: trivy-image-ml-service }
          - { name: authlimit, context: services/authlimit, repository: graph-agent-core-authlimit, category: trivy-image-authlimit }
          - { name: web, context: web, repository: graph-agent-core-web, category: trivy-image-web }
    env:
      IMAGE: ${{ matrix.name }}:ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Main writes the cache and pull requests only read it. On main the runtime stage is rebuilt every time: it holds `apt-get upgrade`,
      # which a cached layer would freeze until the base image changed.
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          # The stage that ships, named: a reordered Dockerfile must not publish the builder (pattern 76).
          target: runtime
          load: true
          tags: ${{ env.IMAGE }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: ${{ github.event_name == 'push' && format('type=gha,mode=max,scope={0}', matrix.name) || '' }}
          no-cache-filters: ${{ github.event_name == 'push' && 'runtime' || '' }}

      - name: The app image contains what the app reads at runtime
        if: matrix.name == 'app'
        run: docker run --rm --entrypoint python "$IMAGE" -m scripts.checks.image_contents

      - name: The ML service image can import its app
        if: matrix.name == 'ml-service'
        run: docker run --rm --entrypoint python "$IMAGE" -c "import main"

      # The one behaviour of this image a build cannot show: with no configuration it refuses to start, naming variables and never a value.
      - name: The authlimit image refuses to start without a configuration
        if: matrix.name == 'authlimit'
        run: |
          set +e
          out=$(docker run --rm "$IMAGE" 2>&1)
          code=$?
          set -e
          echo "$out"
          test "$code" = 2
          echo "$out" | grep -q "AUTHLIMIT_KEYS_DIR: is required"
          # It must never echo a VALUE: a Redis URL can carry a password.
          out=$(docker run --rm -e AUTHLIMIT_REDIS_URL='http://:hunter2@redis:6379' "$IMAGE" 2>&1 || true)
          if echo "$out" | grep -q hunter2; then echo "::error::the service printed a configuration value"; exit 1; fi

      # A build proves neither: the sign-in settings are written when the page is requested, and the server must start with every capability dropped.
      - name: The web image serves the page, configured from its environment, under the hardening compose applies
        if: matrix.name == 'web'
        run: python3 -m scripts.checks.web_image "$IMAGE"

      # Gate on fixable CRITICAL only (dated exceptions in .trivyignore.yaml): the CVE database moves on its own, and a gate nothing can
      # satisfy teaches people to ignore it (pattern 72). HIGH and unfixed ones go to the Security tab, below.
      - name: Trivy gate (fixable CRITICAL vulnerabilities)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}
          severity: CRITICAL
          ignore-unfixed: true
          trivyignores: .trivyignore.yaml
          exit-code: "1"

      - name: Trivy report (HIGH and CRITICAL) as SARIF
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}
          severity: HIGH,CRITICAL
          # Without it the action drops `severity` for SARIF, and every low finding lands in the Security tab.
          limit-severities-for-sarif: true
          format: sarif
          output: trivy-image-results.sarif
          exit-code: "0"
          skip-setup-trivy: true

      - uses: github/codeql-action/upload-sarif@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        continue-on-error: true # code scanning may not be enabled, and a fork's token cannot upload
        with:
          sarif_file: trivy-image-results.sarif
          category: ${{ matrix.category }}

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish this build as the commit's image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          target: runtime
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/${{ matrix.repository }}:${{ github.sha }}
          # A software bill of materials and SLSA build provenance, attached to the image as attestations (pattern 76).
          provenance: mode=max
          sbom: true

  # SAST, dependency, IaC and Go vulnerability scans (security.yml), also run weekly on their own.
  security:
    permissions:
      contents: read
      security-events: write
      packages: read
    uses: ./.github/workflows/security.yml

  # THE required check. A job added to this file is required by being listed here (a test holds the list complete), not by editing the
  # branch ruleset. scripts/tools/ci_gate.py says which jobs may be skipped.
  ci-ok:
    needs:
      - changes
      - lint
      - config
      - typecheck
      - test
      - billing-package
      - web
      - authlimit
      - openapi
      - test-integration
      - test-live
      - promptfoo
      - image
      - security
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Every job succeeded, or was skipped on purpose
        env:
          NEEDS: ${{ toJSON(needs) }}
          EVENT: ${{ github.event_name }}
        run: python3 scripts/tools/ci_gate.py verdict

  # `:latest` is the newest commit of main that passed `ci-ok`. The condition names the result: a plain `needs` would skip this job
  # on main, where `openapi` is skipped, and `failure()` alone would let a cancelled or timed-out run through.
  promote:
    needs: ci-ok
    if: ${{ !cancelled() && needs.ci-ok.result == 'success' && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: promote
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
    outputs:
      current: ${{ steps.head.outputs.current }}
    steps:
      # A slower run of an older commit must not put it back over a newer one.
      - id: head
        name: Is this still main's newest commit?
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          head=$(gh api "repos/$REPO/commits/main" --jq .sha)
          if [ "$head" = "$SHA" ]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::main has moved to $head: that commit's run promotes and deploys, not this one"
            echo "current=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        if: steps.head.outputs.current == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag the four images `latest`
        if: steps.head.outputs.current == 'true'
        env:
          OWNER: ${{ github.repository_owner }}
          SHA: ${{ github.sha }}
        run: |
          for image in graph-agent-core graph-agent-core-ml-service graph-agent-core-authlimit graph-agent-core-web; do
            docker buildx imagetools create -t "ghcr.io/$OWNER/$image:latest" "ghcr.io/$OWNER/$image:$SHA"
          done

  # Off until the repository variable DEPLOY_ENABLED is `true` (deploy/README.md): with no droplet there is nothing to deploy to.
  deploy:
    needs: promote
    if: ${{ !cancelled() && needs.promote.result == 'success' && needs.promote.outputs.current == 'true' && vars.DEPLOY_ENABLED == 'true' }}
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/deploy.yml
    with:
      image_tag: ${{ github.sha }}
    secrets:
      DROPLET_HOST: ${{ secrets.DROPLET_HOST }}
      OBS_DROPLET_HOST: ${{ secrets.OBS_DROPLET_HOST }}
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
