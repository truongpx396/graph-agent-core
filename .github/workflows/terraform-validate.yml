name: Terraform validate

# Structural correctness only (fmt + validate) — deliberately NOT `terraform
# plan`: deploy/terraform's roots (prod/ and dev/) default to local state (see
# prod/versions.tf's own comment), which this runner has no
# access to, so a `plan` here would show "create everything from scratch"
# rather than a real diff against the actual droplet. IaC misconfiguration
# scanning for this same directory lives in .github/workflows/ci.yml's
# `checkov` job instead (runs on every push, not just infra changes — see
# that file's own header). See deploy/README.md for the real, human-run
# `terraform plan`/`apply` workflow.
on:
  pull_request:
    branches: [main]
    paths:
      - "deploy/terraform/**"

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: deploy/terraform
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.9.8"

      - run: terraform fmt -check -diff -recursive
      # One job, not a matrix: a matrix would rename this check to `validate (prod)`, and a branch-protection rule waiting on `validate` would wait forever.
      - name: Validate each root (prod is two droplets, dev is one)
        run: |
          for root in prod dev; do
            echo "::group::terraform validate: $root"
            (cd "$root" && terraform init -backend=false && terraform validate)
            echo "::endgroup::"
          done
