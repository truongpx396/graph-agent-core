name: Strix AI Pentest

# Started by hand only: Strix (https://github.com/usestrix/strix) ATTACKS its target, using a paid cloud model rather than this app's local one.
# Only ever run it against a target you own or have written permission to test; the default, this repository's own source, is one.
# Needs the STRIX_LLM (e.g. "anthropic/claude-sonnet-5-5") and LLM_API_KEY secrets; without them the run fails with an auth error.
# `make strix` and `make strix-app` are the same tool on a laptop.
on:
  workflow_dispatch:
    inputs:
      target:
        description: "'.' for this source tree, or a live URL you own or have permission to test"
        required: true
        default: "."
        type: string
      scan_mode:
        description: "quick is CI-sized; standard is deeper and slower"
        required: true
        default: quick
        type: choice
        options: [quick, standard]

permissions:
  contents: read

jobs:
  strix-pentest:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # A pinned release from PyPI, not `curl https://strix.ai/install | bash`, which ran whatever that address served in a job holding an
      # LLM key. Bumped by hand: Dependabot does not read a pipx install.
      - run: pipx install strix-agent==1.7.0

      - name: Run Strix
        env:
          STRIX_LLM: ${{ secrets.STRIX_LLM }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          TARGET: ${{ inputs.target }}
          SCAN_MODE: ${{ inputs.scan_mode }}
        run: strix -n -t "$TARGET" --scan-mode "$SCAN_MODE"
