# Keeps the commit-SHA pins in .github/workflows/*.yml from rotting. A pinned `uses:` line is
# immutable, which is the point (a moved or force-pushed tag can no longer change what CI runs
# with our secrets), but it also never updates itself: without this file the pins freeze at
# today's versions and quietly miss security fixes in the actions themselves.
#
# github-actions, docker, authlimit's Go modules and the web client's npm lock. The docker entry reads the four Dockerfiles' pinned `FROM` lines (the
# base images and uv, each pinned by digest, ENGINEERING_PATTERNS.md pattern 76) and proposes a new digest weekly: that is what keeps a pinned base
# image fresh. authlimit's was not listed until 2026-11-26, and its image had fallen behind two standard-library security releases. The compose files are NOT read (the `docker-compose` ecosystem would also propose postgres major versions); the LiteLLM
# image digest there is bumped by hand, with `make gateway-check`. The pip ecosystem is left out on purpose:
# requirements-lock.txt is machine-generated from requirements.txt (regenerate, don't hand-edit —
# CLAUDE.md), and a Dependabot PR would hand-edit exactly that file. Revisit if/when the lock is
# produced by a tool Dependabot understands.
version: 2
updates:
  - package-ecosystem: github-actions
    # Plural on purpose: a composite action keeps its own `uses:` pins in its action.yml, which
    # Dependabot only reads when that directory is named. Without the second entry, the pin of
    # actions/cache/save inside .github/actions/save-ollama-cache would be the one that rots.
    directories:
      - /
      - /.github/actions/save-ollama-cache
      - /.github/actions/setup-python
      - /.github/actions/ollama
    schedule:
      interval: weekly
    # A release has to be a week old before it is proposed: a compromised or broken tag is usually pulled within days.
    cooldown:
      default-days: 7
    # One PR for the whole batch rather than eleven: they are reviewed the same way (diff the
    # action's release notes, let CI run) and a single PR keeps the weekly noise to one CI cycle.
    groups:
      github-actions:
        patterns: ["*"]
    commit-message:
      # Matches the repo's commit prefixes (fix:/feat:/test:/docs:/infra:/chore:).
      prefix: infra

  # The web client's lock file. promptfoo/ is left out: a dev-only tool nothing ships.
  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    # Two weeks old before it is proposed, which is how the lock was first resolved (`npm install --before=`).
    cooldown:
      default-days: 14
    groups:
      web:
        patterns: ["*"]
    ignore:
      # openapi-typescript needs TypeScript 5; a major is a decision, not a weekly bump.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: infra

  # The edge authentication service's modules (services/authlimit). Security updates come on their own, whatever the cooldown.
  - package-ecosystem: gomod
    directory: /services/authlimit
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    groups:
      authlimit:
        patterns: ["*"]
    commit-message:
      prefix: infra

  - package-ecosystem: docker
    # Every directory with a pinned Dockerfile (tests/core/test_dockerfile_pins.py keeps this list complete, and the two Python ones' digests equal).
    # deploy/images/ holds the sandbox images, whose bases are not pinned by digest: they stay as they are, and are not what this is for.
    directories:
      - /
      - /services/ml-service
      - /services/authlimit
      - /web
    schedule:
      interval: weekly
    # The intent: a release has to be two weeks old before it is proposed (uv's 0.13 line was days old when the pin was chosen, and a base
    # image tag rebuilt yesterday is not yet something to run in production). Dependabot does NOT apply it here: every Docker PR it has
    # opened (#190, #221, #242, #243, #250) says "Cooldown could not be applied because no publication date was available from the registry",
    # and #242, #243 and #250 proposed uv 0.13.7 when it was under a week old (#243 was merged at six days). So check a release's age
    # before merging one of these PRs (`gh api repos/astral-sh/uv/releases/tags/<tag> --jq .published_at`); the setting stays for the
    # day the registry reports a date.
    cooldown:
      default-days: 14
    # The Python MINOR is a decision (3.13 is what the lock was resolved for), not a bump: only digest refreshes of the same tag.
    ignore:
      - dependency-name: python
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      # The web client's build stage: Node's major is a decision, moved with web/.nvmrc and CI's setup-node.
      - dependency-name: node
        update-types: ["version-update:semver-major"]
      # Go's minor is a decision (go.mod and CI move with it): only patch releases and digest refreshes.
      - dependency-name: golang
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
    groups:
      docker-images:
        patterns: ["*"]
    commit-message:
      prefix: infra
