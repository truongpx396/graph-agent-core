name: Set up Python and install a job's requirements
description: >
  Python 3.13 with pip's download cache, then the requirement files a job names (the lock file by default). One place for what nine jobs
  had each copied.

inputs:
  requirements:
    description: Space-separated requirement files to install, in one resolve.
    default: requirements-lock.txt
  billing:
    description: >
      "true" also installs packages/billing, for a job that starts a process of its own (uvicorn, a worker, a script): pytest's `pythonpath`
      and mypy's `mypy_path` find it by path, such a process does not (spec 011). `test` and `typecheck` leave it out on purpose: they prove
      those two settings are enough.
    default: "false"

runs:
  using: composite
  steps:
    - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: "3.13"
        cache: pip
        cache-dependency-path: requirements*.txt
    - shell: bash
      env:
        REQUIREMENTS: ${{ inputs.requirements }}
      run: |
        args=()
        for file in $REQUIREMENTS; do args+=(-r "$file"); done
        pip install "${args[@]}"
    - if: inputs.billing == 'true'
      shell: bash
      run: pip install --no-deps ./packages/billing
